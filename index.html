<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CastSurf Receiver</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; overflow: hidden;
      font-family: -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif;
    }
    /* 기본 미디어(추출·파일 캐스팅)는 CAF가 이 요소로 재생한다 */
    cast-media-player { --background-color: #000; }

    /* 사진 슬라이드쇼: 두 장을 겹쳐두고 CSS로 크로스페이드 → 검은 화면 없이 전환 */
    #slideshow { position: fixed; inset: 0; display: none; background: #000; }
    #slideshow.active { display: block; }
    #slideshow img {
      position: absolute; inset: 0; margin: auto;
      max-width: 100%; max-height: 100%;
      opacity: 0; transition: opacity 0.8s ease;
    }
    #slideshow img.show { opacity: 1; }

    /* 저지연 미러링: fMP4 조각을 MediaSource로 직접 받아 그린다 */
    #mirror { position: fixed; inset: 0; display: none; background: #000; }
    #mirror.active { display: block; }
    #mirror video { width: 100%; height: 100%; object-fit: contain; background: #000; }

    #idle {
      position: fixed; inset: 0; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      color: #8b95a1; gap: 20px;
    }
    /* TV는 멀리서 본다. 그림을 넉넉히 키운다. 가로로 긴 그림이라 폭 기준으로 잡는다. */
    #idle .mark {
      width: min(62vw, 760px); height: auto;
      filter: drop-shadow(0 18px 40px rgba(0,0,0,0.55));
    }
    #idle.hidden { display: none; }
    /* 앱 스플래시와 같은 조합: Cast는 밝은 회색, Surf는 파랑 */
    #idle .logo { font-size: 44px; font-weight: 800; letter-spacing: -1.5px; }
    #idle .logo .c { color: #e8ebee; }
    #idle .logo .s { color: #3f7de0; }
    #status { position: fixed; left: 12px; bottom: 10px; font-size: 12px; color: #444; }
  </style>
</head>
<body>
  <div id="idle">
    <img class="mark" src="castsurf-cast.png" alt="">
    <div class="logo"><span class="c">Cast</span><span class="s">Surf</span></div>
    <div>연결됨 · 재생 대기 중</div>
  </div>

  <cast-media-player></cast-media-player>
  <div id="slideshow"></div>
  <div id="mirror"><video id="mirrorVideo" autoplay playsinline muted></video></div>
  <div id="status"></div>

  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    // 앱과 주고받는 전용 채널. 폰 쪽 코드의 네임스페이스와 반드시 같아야 한다.
    const NAMESPACE = 'urn:x-cast:com.castwave';

    // 이 페이지의 판. 리시버를 고쳐 배포할 때마다 올린다.
    // Chromecast가 캐시된 옛 페이지를 들고 있으면 고친 것이 반영되지 않는데,
    // 겉으로는 구분이 안 돼 원인을 엉뚱한 데서 찾게 된다. 앱이 이 값을 로그에 남긴다.
    const BUILD = '2026-08-28.3';

    const context = cast.framework.CastReceiverContext.getInstance();
    const idle = document.getElementById('idle');
    const slideshow = document.getElementById('slideshow');
    const statusEl = document.getElementById('status');
    function log(msg) { statusEl.textContent = msg; }

    // 리시버에서 난 오류는 TV 화면에만 보인다. 무엇이 터졌는지 바로 알 수 있게 적어둔다.
    window.addEventListener('error', (event) => {
      log('오류: ' + (event.message || '알 수 없음'));
    });

    // 시작을 기능 코드보다 먼저 끝낸다.
    //
    // 아래 어딘가에서 예외가 나면 그 뒤 줄이 전부 실행되지 않는다. 시작이 뒤에 있으면
    // 리시버가 준비 신호를 못 보내고, 발신자는 60초 타임아웃으로 연결에 실패한다.
    // 기능 하나가 깨졌다고 연결 자체가 막히면 안 된다. (실제로 그렇게 두 번 막혔다.)
    const options = new cast.framework.CastReceiverOptions();
    options.customNamespaces = { [NAMESPACE]: cast.framework.system.MessageType.JSON };
    // 무활동 타이머는 CAF 미디어 플레이어의 재생만 활동으로 친다.
    // 미러링은 그 플레이어를 거치지 않고 자체 <video>로 재생하므로,
    // 이 값을 짧게 잡으면 화면 공유가 멀쩡히 돌던 중에 시간이 차서 끊긴다.
    // 대신 좀비로 남지 않도록 마지막 발신자가 떠날 때 스스로 끈다(아래 참고).
    options.maxInactivity = 3600;
    // 폰이 붙자마자 한 번 알려준다. 폰이 물어보지 않아도 로그에 남는다.
    context.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, () => {
      setTimeout(reportCapabilities, 300);
    });

    // 폰이 떠나면 미러링을 정리한다. 남겨두면 fetch 루프와 MediaSource가 계속 살아 있어
    // 다음 연결에서 리시버가 제대로 못 뜬다.
    // 마지막 발신자가 떠났고 하는 일도 없으면 스스로 끈다.
    // 남겨두면 다음 연결이 그 좀비에 막혀 60초 타임아웃으로 실패한다.
    //
    // 다만 화면 공유 중에는 끄면 안 된다. 미러링 영상은 폰의 방송 확장이 직접 보내므로
    // 발신자 연결과 무관하게 흐른다. 앱이 잠깐 백그라운드로 밀려 세션이 끊겼다고
    // 리시버가 자살하면, 멀쩡히 나오던 화면이 그대로 멈춘다.
    function stopIfNobodyNeedsUs(why) {
      let senders = 0;
      try { senders = context.getSenders().length; } catch (e) {}
      if (senders > 0) { log(why + ' (남은 발신자 ' + senders + ')'); return; }
      if (mirror.classList.contains('active')) {
        log(why + ' · 화면 공유 중이라 유지');
        return;
      }
      log('발신자 없음 → 리시버 종료');
      setTimeout(() => { try { context.stop(); } catch (e) {} }, 1000);
    }

    context.addEventListener(cast.framework.system.EventType.SENDER_DISCONNECTED, () => {
      // 미러링은 건드리지 않는다. 발신자가 끊겼다고 화면 공유가 끝난 것은 아니다.
      if (slideTimer) { clearInterval(slideTimer); slideTimer = null; }
      slideshow.classList.remove('active');
      if (!mirror.classList.contains('active')) idle.classList.remove('hidden');

      stopIfNobodyNeedsUs('연결 해제됨');
    });

    context.start(options);
    log('CastSurf 리시버 준비됨 · ' + cast.framework.VERSION);

    // ── 기본 미디어 재생 (추출·파일 캐스팅) ─────────────
    const playerManager = context.getPlayerManager();
    playerManager.addEventListener(
      cast.framework.events.EventType.PLAYER_LOAD_COMPLETE,
      () => {
        // 미러링 화면이 위에 남아 있으면 일반 재생을 덮어버린다.
        stopMirror();
        idle.classList.add('hidden');
        slideshow.classList.remove('active');
        log('재생 중');
      }
    );

    // 재생이 실패하면 리시버만 이유를 안다. 폰은 idle(error)까지밖에 못 본다.
    // 무엇이 왜 실패했는지 그대로 돌려보내 로그에 남긴다.
    function reportError(where, detail) {
      log('오류: ' + where);
      try {
        context.sendCustomMessage(NAMESPACE, undefined, {
          type: 'error', where: where, detail: detail
        });
      } catch (e) {}
    }

    // 진단용 리스너는 있으면 좋은 것이지 없으면 안 되는 것이 아니다.
    // 이벤트 이름이 SDK 버전에 없으면 addEventListener가 예외를 던지는데,
    // 그게 시작 코드를 멈춰 리시버가 아예 안 뜨는 사고로 이어진 적이 있다.
    function watch(eventName, handler) {
      try {
        const type = cast.framework.events.EventType[eventName];
        if (!type) return;
        playerManager.addEventListener(type, handler);
      } catch (e) {
        log('리스너 등록 실패: ' + eventName);
      }
    }

    watch('ERROR', (event) => {
      reportError('player', {
        detailedErrorCode: event.detailedErrorCode,
        reason: event.reason,
        error: event.error && String(event.error)
      });
    });

    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      (request) => {
        const media = request.media || {};
        log('로드 요청: ' + (media.contentType || '?'));
        try {
          context.sendCustomMessage(NAMESPACE, undefined, {
            type: 'loadRequest',
            contentId: media.contentId || media.contentUrl,
            contentType: media.contentType,
            streamType: media.streamType
          });
        } catch (e) {}
        return request;
      }
    );
    playerManager.addEventListener(
      cast.framework.events.EventType.MEDIA_FINISHED,
      () => { idle.classList.remove('hidden'); log('대기'); }
    );

    // ── 사진 슬라이드쇼 (커스텀 채널) ──────────────────
    // 폰이 { type:'slideshow', urls:[...], seconds:5, loop:true } 를 보낸다.
    let slideTimer = null, slideIndex = 0, slideUrls = [], slideSeconds = 5, slideLoop = false;
    let imgA, imgB, current;

    function startSlideshow(data) {
      stopMirror();
      playerManager.stop();
      idle.classList.add('hidden');
      slideshow.classList.add('active');
      slideshow.innerHTML = '';
      imgA = document.createElement('img');
      imgB = document.createElement('img');
      slideshow.append(imgA, imgB);
      current = imgA;

      slideUrls = data.urls || [];
      slideSeconds = data.seconds || 5;
      slideLoop = !!data.loop;
      slideIndex = 0;
      if (slideTimer) clearInterval(slideTimer);
      if (!slideUrls.length) return;

      showSlide(0);
      slideTimer = setInterval(nextSlide, slideSeconds * 1000);
      log('슬라이드쇼 ' + slideUrls.length + '장');
    }

    function showSlide(i) {
      const next = (current === imgA) ? imgB : imgA;
      next.onload = () => {
        next.classList.add('show');
        current.classList.remove('show');
        current = next;
      };
      next.src = slideUrls[i];
    }

    function nextSlide() {
      slideIndex++;
      if (slideIndex >= slideUrls.length) {
        if (slideLoop) { slideIndex = 0; }
        else { clearInterval(slideTimer); slideTimer = null; log('슬라이드쇼 완료'); return; }
      }
      showSlide(slideIndex);
    }

    // ── 저지연 미러링 (fMP4 + MediaSource) ─────────────
    // 폰이 { type:'mirror', url, mime } 를 보내면 그 주소를 열어두고
    // 흘러오는 조각을 SourceBuffer에 그대로 넣는다. 플레이리스트도 조각 목록도 없다.
    const mirror = document.getElementById('mirror');
    const mirrorVideo = document.getElementById('mirrorVideo');
    let mirrorAbort = null, mirrorTrim = null;

    function stopMirror() {
      if (mirrorAbort) { mirrorAbort.abort(); mirrorAbort = null; }
      if (mirrorTrim) { clearInterval(mirrorTrim); mirrorTrim = null; }
      mirrorVideo.removeAttribute('src');
      mirrorVideo.load();
      mirror.classList.remove('active');
    }

    async function startMirror(data) {
      stopMirror();
      playerManager.stop();
      slideshow.classList.remove('active');
      idle.classList.add('hidden');
      mirror.classList.add('active');

      const mime = data.mime || 'video/mp4; codecs="avc1.4D401F, mp4a.40.2"';
      if (!MediaSource.isTypeSupported(mime)) { log('미지원 형식: ' + mime); return; }

      const source = new MediaSource();
      mirrorVideo.src = URL.createObjectURL(source);
      // 소리를 같이 보내므로 음소거를 푼다. (자동재생 정책 때문에 muted로 시작한다)
      mirrorVideo.muted = false;

      await new Promise((resolve) => source.addEventListener('sourceopen', resolve, { once: true }));
      const buffer = source.addSourceBuffer(mime);
      // 조각의 시작 시각을 그대로 믿지 않고 이어 붙인다. 중간부터 받아도 재생된다.
      buffer.mode = 'sequence';

      const pending = [];
      let appending = false;
      function pump() {
        if (appending || !pending.length || buffer.updating) return;
        appending = true;
        try { buffer.appendBuffer(pending.shift()); }
        catch (e) { appending = false; log('append 실패: ' + e.message); }
      }
      buffer.addEventListener('updateend', () => { appending = false; pump(); });

      // 오래된 구간을 버려야 메모리도, 지연도 늘지 않는다.
      // 재생 위치가 라이브 엣지에서 밀리면 살짝 빨리 감아 따라붙는다.
      mirrorTrim = setInterval(() => {
        // 스트림이 끊기거나 소스가 닫히면 buffered 접근 자체가 예외를 던진다.
        // 700ms마다 예외가 쌓이면 리시버가 불안정해져 다음 연결까지 막힌다.
        try {
          if (buffer.updating || !buffer.buffered.length) return;
          const end = buffer.buffered.end(buffer.buffered.length - 1);
          const start = buffer.buffered.start(0);
          if (end - start > 6) buffer.remove(start, end - 4);

          const behind = end - mirrorVideo.currentTime;
          if (behind > 2.0) { mirrorVideo.currentTime = end - 0.4; }
          else if (behind > 0.9) { mirrorVideo.playbackRate = 1.1; }
          else { mirrorVideo.playbackRate = 1.0; }
        } catch (e) {
          clearInterval(mirrorTrim);
          mirrorTrim = null;
        }
      }, 700);

      mirrorAbort = new AbortController();
      log('미러링 연결 중…');
      try {
        const response = await fetch(data.url, { signal: mirrorAbort.signal });
        const reader = response.body.getReader();
        log('미러링 재생');
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          pending.push(value);
          pump();
        }
      } catch (e) {
        if (e.name !== 'AbortError') log('미러링 끊김: ' + e.message);
      }

      // 스트림이 끝났다. 폰이 이미 떠났다면 이제 리시버를 붙잡아둘 이유가 없다.
      mirror.classList.remove('active');
      idle.classList.remove('hidden');
      stopIfNobodyNeedsUs('화면 공유 종료');
    }

    // ── 능력 보고 ──────────────────────────────────
    // 저지연 미러링을 어떤 방식으로 보낼지 폰이 정하려면, 이 기기가
    // MSE(Media Source Extensions)로 fMP4를 받아줄 수 있는지 알아야 한다.
    // 동글마다 다르므로 추측하지 않고 기기가 직접 답하게 한다.
    function capabilities() {
      const codecs = [
        'video/mp4; codecs="avc1.42E01E"',
        'video/mp4; codecs="avc1.42E01E, mp4a.40.2"',
        'video/mp4; codecs="avc1.4D401F, mp4a.40.2"',
        'video/webm; codecs="vp8, vorbis"'
      ];
      const supported = {};
      const hasMSE = typeof MediaSource !== 'undefined';
      if (hasMSE) {
        codecs.forEach((c) => { supported[c] = MediaSource.isTypeSupported(c); });
      }
      return {
        type: 'capabilities',
        build: BUILD,
        maxInactivity: options.maxInactivity,
        mse: hasMSE,
        sourceBuffer: typeof SourceBuffer !== 'undefined',
        managedMediaSource: typeof ManagedMediaSource !== 'undefined',
        webSocket: typeof WebSocket !== 'undefined',
        fetchStream: typeof ReadableStream !== 'undefined',
        webRTC: typeof RTCPeerConnection !== 'undefined',
        codecs: supported,
        userAgent: navigator.userAgent,
        cafVersion: cast.framework.VERSION
      };
    }

    function reportCapabilities() {
      const payload = capabilities();
      context.sendCustomMessage(NAMESPACE, undefined, payload);
      log('능력 보고 전송 · MSE=' + payload.mse);
    }

    context.addCustomMessageListener(NAMESPACE, (event) => {
      const data = event.data || {};
      log('메시지: ' + (data.type || '?'));
      if (data.type === 'probe') reportCapabilities();
      else if (data.type === 'mirror') startMirror(data);
      else if (data.type === 'stopMirror') { stopMirror(); idle.classList.remove('hidden'); }
      else if (data.type === 'slideshow') startSlideshow(data);
      else if (data.type === 'stopSlideshow') {
        if (slideTimer) clearInterval(slideTimer);
        slideshow.classList.remove('active');
        idle.classList.remove('hidden');
      }
    });

  </script>
</body>
</html>
